name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASKAI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ASKAI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ASKAI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Prepare signing (optional)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${ASKAI_KEYSTORE_PASSWORD:-}" && -n "${ASKAI_KEY_ALIAS:-}" && -n "${ASKAI_KEY_PASSWORD:-}" ]]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/askai-release.jks"
            echo "ASKAI_KEYSTORE_FILE=$RUNNER_TEMP/askai-release.jks" >> "$GITHUB_ENV"
            echo "ASKAI_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "ASKAI_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Signing secrets incomplete: debug APK only; workflow will continue."
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
      - name: Build signed release APK when secrets exist
        if: startsWith(github.ref, 'refs/tags/v') && env.ASKAI_SIGNING_AVAILABLE == 'true'
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee -a build.log
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askai-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Create error summary
        if: failure()
        shell: bash
        run: |
          {
            echo '# Ask AI build failure summary'; echo; echo "Commit: $GITHUB_SHA"; echo "Ref: $GITHUB_REF"; echo; echo '## Build log tail'
            if [[ -f build.log ]]; then tail -n 400 build.log; else echo 'build.log was not created'; fi
          } > error-summary.md
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: askai-build-failure-${{ github.run_number }}
          path: |
            build.log
            error-summary.md
          if-no-files-found: warn
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.ASKAI_SIGNING_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: true
